active_learning:
  counterfactuals:
    alpha_cf: 1.0
    enabled: true
    generation_temperature: 0.0
    max_per_example: 3
    max_tokens: 256
    prompt_variation: true
    quality_filtering:
      alpha: 0.3
      beta: 0.5
      delta: 0.1
      embedding_model: all-MiniLM-L6-v2
      enabled: true
      r_max: 1.3
      r_min: 0.7
      s_max: 0.98
      s_min: 0.7
      tau_conf: 0.4
    target_label_selection:
      lambda: 0.5
      strategy: confusion
  initial_labeled_per_class: 5
cf_only:
  budgets:
  - 10
  - 20
  - 30
  - 40
  - 50
  - 100
dataset:
  columns:
    id: id
    label: Label
    text: example
  exclude_labels:
  - none
  - None
  - null
  - ''
  test_file: yelp_test.csv
  train_file: yelp_train.csv
directories:
  input_data: ../../input_data
evaluation:
  classifier_type: static
  max_icl_examples: 800
  retrieval:
    embedding_backend: bm25
    fallback_strategy: similarity
    k_per_class: 5
    total_k_max: 50
llm:
  openai:
    api_key: a6705b22532443ee8c0cfda232e57e06
    azure_endpoint: https://vietgpt.openai.azure.com/
    model: gpt-4o-2024-11-20
  provider: openai
processing:
  seed: 42
